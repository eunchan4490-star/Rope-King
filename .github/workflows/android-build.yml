name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages required by Godot
        run: sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          SETTINGS='[gd_resource type="EditorSettings" format=3]\\n\\n[resource]\\n\\nexport/android/android_sdk_path = "'"$ANDROID_SDK_ROOT"'"\\nexport/android/java_sdk_path = "'"$JAVA_HOME"'"\\nexport/android/debug_keystore = "'"$HOME/.android/debug.keystore"'"\\nexport/android/debug_keystore_user = "androiddebugkey"\\nexport/android/debug_keystore_pass = "android"\\n'
          printf "%b" "$SETTINGS" > "$HOME/.config/godot/editor_settings-4.tres"
          printf "%b" "$SETTINGS" > "$HOME/.config/godot/editor_settings-4.6.tres"

      - name: Export APK with Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          verbose: true
          archive_output: false
          cache: true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rope-King-Android
          path: ${{ steps.export.outputs.build_directory }}/Android/*.apk
          if-no-files-found: error
          retention-days: 30
