name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export APK with Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          archive_output: false
          cache: true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rope-King-Android
          path: ${{ steps.export.outputs.build_directory }}/Android/*.apk
          if-no-files-found: error
          retention-days: 30
